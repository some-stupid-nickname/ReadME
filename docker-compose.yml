services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: rag-backend:latest
    container_name: rag-backend
    environment:
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      BOOKS_DB_PATH: /app/data/storage.sqlite
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - books_data:/app/data
      - ./data/storage.sqlite:/app/data/storage.sqlite:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - rag-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: rag-frontend:latest
    container_name: rag-frontend
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - rag-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Telegram Bot
  telegram-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.telegram-bot
    image: rag-telegram-bot:latest
    container_name: rag-telegram-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BACKEND_API_URL: http://backend:8000
    networks:
      - rag-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
  books_data:
